name: Release

# A pushed tag v<version> builds the installers, each platform on its own runner, and uploads them to one draft
# release for that tag; edit the notes on github.com and publish. `pnpm release <version>` makes the tag
# (tools/dev/release.mjs). The packaging itself is apps/desktop/electron-builder.yml.
#
# Each platform builds on its own runner, as Electron packaging does. The agents are not in the build: their
# adapters and CLIs download on first use (apps/desktop/src/main/agent-install.ts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The draft release is made first, once. electron-builder uploads its artifacts in parallel and each upload
  # looks the draft up or creates it, which made two drafts on the first release; a draft that already exists is
  # found by every upload and every platform.
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - run: gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --draft --title "${TAG#v}" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

  build:
    needs: draft
    # A manual run has no tag and skips the draft; the build still runs, and publishes nothing.
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          # Apple silicon. Unsigned until the signing and notarization secrets exist (CSC_LINK, CSC_KEY_PASSWORD,
          # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID), so macOS 15 blocks it for anyone but a tester.
          - os: macos-14
          # Next: `- os: ubuntu-22.04`, once the build has been checked.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build and publish
        run: pnpm --filter @qrabbit/desktop run dist --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The cloud this build talks to (apps/desktop/.env.example): repository variables, never the source.
          QRABBIT_CLOUD_URL: ${{ vars.QRABBIT_CLOUD_URL }}
          QRABBIT_CLOUD_PUBLISHABLE_KEY: ${{ vars.QRABBIT_CLOUD_PUBLISHABLE_KEY }}
          # No certificate yet: build unsigned rather than search the runner's keychain for one.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # A manual run publishes nothing; its builds are kept as artifacts for a look.
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: qrabbit-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
          if-no-files-found: error
